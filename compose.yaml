services:
  registry-proxy:
    build: .
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      APP_URL: "${APP_URL:-localhost}"
      APP_PORT: "5000"
      HOST: "::"
      DEFAULT_REGISTRY: "${DEFAULT_REGISTRY:-docker.io}"
      SAVE_IMAGE_URL: "${SAVE_IMAGE_URL:-https://dockerimagesave.akiel.dev/image}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-3600}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      UPSTREAM_TIMEOUT_MS: "${UPSTREAM_TIMEOUT_MS:-120000}"
      CACHE_DIR: "/app/data/cache"
    volumes:
      - registry-proxy-cache:/app/data/cache

volumes:
  registry-proxy-cache:
