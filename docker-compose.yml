services:
  registry-proxy:
    build: .
    container_name: docker-registry-proxy
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATA_DIR=/app/data
      - SOURCE_BASE_URL=https://dockerimagesave.akiel.dev/image
      - DEFAULT_PLATFORM_OS=linux
      - DEFAULT_PLATFORM_ARCH=amd64
    volumes:
      - registry-data:/app/data

volumes:
  registry-data: